name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16, 18]  # Specify the Node.js versions to test against

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm test  # Make sure your package.json has a script like "test": "jest" or "mocha"

    - name: Upload test results (optional)
      if: success()  # This uploads results only if tests are successful
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: ./test-results  # Adjust if you want to store test logs
